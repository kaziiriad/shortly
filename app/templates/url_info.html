<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .url-card {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .redirect-message {
            text-align: center;
            margin-top: 20px;
        }
        .url-details {
            word-break: break-all;
        }
        .stats-badge {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="url-card">
            <div class="header">
                <h1 class="mb-3">URL Information</h1>
            </div>
            
            <div class="url-details">
                <div class="mb-3">
                    <h5>Short URL</h5>
                    <p class="text-primary">{{ url.short_url }}</p>
                </div>
                
                <div class="mb-3">
                    <h5>Original URL</h5>
                    <p>{{ url.original_url }}</p>
                </div>
                
                <div class="mb-3 d-flex justify-content-between">
                    <div>
                        <h5>Created</h5>
                        <p>{{ url.created_at }}</p>
                    </div>
                    <div>
                        <span class="badge bg-info stats-badge">
                            <i class="bi bi-eye"></i> {{ url.visits }} visits
                        </span>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <a href="{{ url.original_url }}" class="btn btn-primary">
                        Go to Original URL
                    </a>
                    <a href="/" class="btn btn-outline-secondary">
                        Create New Short URL
                    </a>
                </div>
            </div>
            
            <div class="redirect-message">
                <p class="text-muted">You will be redirected to the original URL in <span id="countdown">5</span> seconds...</p>
            </div>
        </div>
    </div>

    <script>
        // Countdown for automatic redirect
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        const originalUrl = "{{ url.original_url }}";
        
        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = originalUrl;
            }
        }, 1000);
    </script>
</body>
</html>
