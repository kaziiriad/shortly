<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .url-form {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .result-card {
            margin-top: 20px;
            display: none;
        }
        .copy-btn {
            cursor: pointer;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="url-form">
            <div class="header">
                <h1 class="mb-3">URL Shortener</h1>
                <p class="text-muted">Create a shortened URL for easy sharing</p>
            </div>
            
            <form id="shortenForm">
                <div class="mb-3">
                    <label for="originalUrl" class="form-label">Enter your URL</label>
                    <input type="url" class="form-control" id="originalUrl" 
                           placeholder="https://example.com/very/long/url" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Shorten URL</button>
            </form>
            
            <div class="result-card card" id="resultCard">
                <div class="card-body">
                    <h5 class="card-title">Your shortened URL</h5>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="shortUrl" readonly>
                        <button class="btn btn-outline-secondary copy-btn" type="button" id="copyBtn">
                            Copy
                        </button>
                    </div>
                    <p class="card-text">
                        <small class="text-muted">Created: <span id="createdAt"></span></small>
                    </p>
                    <a href="#" class="btn btn-sm btn-outline-primary" id="visitUrl">Visit URL</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('shortenForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const originalUrl = document.getElementById('originalUrl').value;
            
            try {
                const response = await fetch(`/urls/create?original_url=${encodeURIComponent(originalUrl)}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to create short URL');
                }
                
                const data = await response.json();
                
                // Display the result
                document.getElementById('shortUrl').value = data.short_url;
                document.getElementById('createdAt').textContent = new Date(data.created_at).toLocaleString();
                document.getElementById('visitUrl').href = data.short_url;
                document.getElementById('resultCard').style.display = 'block';
                
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
        
        document.getElementById('copyBtn').addEventListener('click', function() {
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.select();
            document.execCommand('copy');
            
            this.textContent = 'Copied!';
            setTimeout(() => {
                this.textContent = 'Copy';
            }, 2000);
        });
    </script>
</body>
</html>
