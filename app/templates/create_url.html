<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .url-form {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .result-card {
            margin-top: 20px;
            display: none;
        }
        .error-alert {
            margin-top: 20px;
            display: none;
        }
        .copy-btn {
            cursor: pointer;
        }
        .debug-info {
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="url-form">
            <div class="header">
                <h1 class="mb-3">URL Shortener</h1>
                <p class="text-muted">Create a shortened URL for easy sharing</p>
            </div>
            
            <form id="shortenForm">
                <div class="mb-3">
                    <label for="originalUrl" class="form-label">Enter your URL</label>
                    <input type="url" class="form-control" id="originalUrl" 
                           placeholder="https://example.com/very/long/url" required>
                    <div class="form-text">Enter a complete URL including http:// or https://</div>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Shorten URL</button>
            </form>
            
            <div class="alert alert-danger error-alert" id="errorAlert" role="alert">
                <strong>Error:</strong> <span id="errorMessage"></span>
            </div>
            
            <div class="result-card card" id="resultCard">
                <div class="card-body">
                    <h5 class="card-title">Your shortened URL</h5>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="shortUrl" readonly>
                        <button class="btn btn-outline-secondary copy-btn" type="button" id="copyBtn">
                            Copy
                        </button>
                    </div>
                    <p class="card-text">
                        <small class="text-muted">Created: <span id="createdAt"></span></small>
                    </p>
                    <a href="#" class="btn btn-sm btn-outline-primary" id="visitUrl">Visit URL</a>
                </div>
            </div>
            
            <div class="debug-info" id="debugInfo">
                <h6>Debug Information:</h6>
                <pre id="debugContent"></pre>
            </div>
        </div>
    </div>

    <script>
        // Show debug info in development
        const showDebug = false; // Set to false in production
        
        function logDebug(message, data) {
            if (showDebug) {
                console.log(message, data);
                const debugInfo = document.getElementById('debugInfo');
                const debugContent = document.getElementById('debugContent');
                
                let content = debugContent.textContent;
                content += `\n[${new Date().toISOString()}] ${message}\n`;
                if (data) {
                    content += JSON.stringify(data, null, 2) + '\n';
                }
                
                debugContent.textContent = content;
                debugInfo.style.display = 'block';
            }
        }
        
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = message;
            errorAlert.style.display = 'block';
            
            // Hide after 5 seconds
            setTimeout(() => {
                errorAlert.style.display = 'none';
            }, 5000);
        }
        
        document.getElementById('shortenForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalUrl = document.getElementById('originalUrl').value;
            
            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...';
            
            // Hide previous results/errors
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorAlert').style.display = 'none';
            
            logDebug('Submitting URL', { originalUrl });
            
            try {
                const response = await fetch(`/urls/create?original_url=${encodeURIComponent(originalUrl)}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                logDebug('Response status', { status: response.status });
                
                const responseText = await response.text();
                logDebug('Response text', { text: responseText });
                
                let data;
                try {
                    data = JSON.parse(responseText);
                    logDebug('Parsed JSON response', data);
                } catch (parseError) {
                    logDebug('Failed to parse JSON', { error: parseError.message });
                    throw new Error('Invalid response from server');
                }
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to create short URL');
                }
                
                // Display the result
                document.getElementById('shortUrl').value = data.short_url;
                document.getElementById('createdAt').textContent = new Date(data.created_at).toLocaleString();
                document.getElementById('visitUrl').href = data.short_url;
                document.getElementById('resultCard').style.display = 'block';
                
            } catch (error) {
                logDebug('Error occurred', { error: error.message });
                showError(error.message);
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtn.textContent = 'Shorten URL';
            }
        });
        
        document.getElementById('copyBtn').addEventListener('click', function() {
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.select();
            document.execCommand('copy');
            
            this.textContent = 'Copied!';
            setTimeout(() => {
                this.textContent = 'Copy';
            }, 2000);
        });
    </script>
</body>
</html>
